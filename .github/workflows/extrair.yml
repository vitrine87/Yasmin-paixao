name: Extrair zip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair e remover o zip
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z" && rm -f "$z"; done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona arquivos do site" || exit 0
          git push
